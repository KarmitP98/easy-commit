<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="smart-commit banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/><stop offset="0.55" stop-color="#312e81"/><stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <g opacity="0.15" stroke="#ffffff" stroke-width="1">
    <path d="M0 60H1200M0 120H1200M0 180H1200M0 240H1200M0 300H1200"/>
    <path d="M100 0V360M300 0V360M500 0V360M700 0V360M900 0V360M1100 0V360"/>
  </g>
  <g stroke="url(#ac)" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M60 280H400"/>
    <path d="M170 280C210 280 200 220 250 220H400"/>
    <path d="M280 280C320 280 310 160 360 160H400"/>
  </g>
  <g fill="#0f172a" stroke="#22d3ee" stroke-width="5">
    <circle cx="60" cy="280" r="13"/><circle cx="170" cy="280" r="13"/><circle cx="280" cy="280" r="13"/>
    <circle cx="400" cy="280" r="13"/><circle cx="400" cy="220" r="13"/><circle cx="400" cy="160" r="13"/>
  </g>
  <text x="60" y="110" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" fill="#c4b5fd" letter-spacing="6">CLAUDE SKILL</text>
  <text x="500" y="170" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="84" font-weight="800" fill="#ffffff">smart commit</text>
  <text x="500" y="220" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" fill="#e0e7ff">One command. Clean history. Optional PR + merge.</text>
  <g font-family="Consolas, Menlo, monospace" font-size="24" font-weight="700">
    <rect x="500" y="250" width="70" height="42" rx="21" fill="#22d3ee"/><text x="535" y="279" text-anchor="middle" fill="#0f172a">-p</text>
    <rect x="590" y="250" width="90" height="42" rx="21" fill="#a78bfa"/><text x="635" y="279" text-anchor="middle" fill="#0f172a">-pr</text>
    <rect x="700" y="250" width="70" height="42" rx="21" fill="#f472b6"/><text x="735" y="279" text-anchor="middle" fill="#0f172a">-m</text>
  </g>
</svg>
